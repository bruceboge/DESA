<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DESA Decides 2026 - Official Election Results</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app-container">
    <div class="header">
      <div class="header-brand">
        <img class="brand-logo" src="logo.jpg" alt="DESA logo" onerror="this.style.display='none';" />
        <h1><a href="index.html">🗳️ DESA Decides 2026</a> <span>Official</span></h1>
      </div>
      <div class="nav-tabs">
        <a href="index.html">🔐 Login</a>
        <a href="ballot.html">📋 Ballot</a>
        <a href="results.html" class="active">📊 Results</a>
        <a href="admin.html">⚙️ Admin</a>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <div class="flex-between" style="margin-bottom:18px">
          <h2>📊 Official Election Results</h2>
          <button class="secondary small" id="refreshResultsBtn">🔄 Refresh Tallies</button>
        </div>
        <div id="resultsStatusBanner"></div>
        <div id="publicStatsContainer" class="stats-grid hidden"></div>
        <div id="publicResultsList">
          <div class="empty-msg">Connecting to live electoral database...</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { api, escapeHtml } from './common.js';

    const resultsStatusBanner = document.getElementById('resultsStatusBanner');
    const publicStatsContainer = document.getElementById('publicStatsContainer');
    const publicResultsList = document.getElementById('publicResultsList');
    const refreshResultsBtn = document.getElementById('refreshResultsBtn');

    async function loadResults() {
      try {
        const data = await api('/results');
        renderResults(data);
      } catch (err) {
        publicResultsList.innerHTML = `<div class="empty-msg" style="color:#c93b3b">${escapeHtml(err.message)}</div>`;
      }
    }

    function renderResults(data) {
      if (!data || !data.published) {
        publicStatsContainer.classList.add('hidden');
        resultsStatusBanner.innerHTML = `
          <div class="card" style="text-align:center;padding:42px;border:2px dashed #cbd5e1">
            <div style="font-size:3rem;margin-bottom:12px">🔒</div>
            <h3 style="color:#0b2b4f;margin-bottom:8px">Official Results Are Withheld</h3>
            <p style="color:#5e7c9a;max-width:500px;margin:0 auto">
              ${escapeHtml(data?.message || 'The Election Commission has not released public tallies yet. Please check back after voting concludes.')}
            </p>
          </div>
        `;
        publicResultsList.innerHTML = '';
        return;
      }

      resultsStatusBanner.innerHTML = '';
      publicStatsContainer.classList.remove('hidden');

      publicStatsContainer.innerHTML = `
        <div class="stat-card">
          <span class="stat-label">👥 Total Voters</span>
          <span class="stat-value">${data.totalVoters || 0}</span>
          <span class="stat-sub">Registered</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">🗳️ Ballots Cast</span>
          <span class="stat-value">${data.totalBallotsCast || 0}</span>
          <span class="stat-sub">${data.totalVotesCast || 0} votes recorded</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">📈 Voter Turnout</span>
          <span class="stat-value">${data.turnoutPercent || 0}%</span>
          <span class="stat-sub">${data.votingOpen ? 'Voting in progress' : 'Voting concluded'}</span>
        </div>
      `;

      const positions = data.positions || [];
      if (!positions.length) {
        publicResultsList.innerHTML = '<div class="empty-msg">No elective positions to display.</div>';
        return;
      }

      publicResultsList.innerHTML = positions.map((pos) => {
        const candidates = pos.candidates || [];
        return `
          <div class="results-card">
            <div class="results-header">
              <h3>🏛️ ${escapeHtml(pos.title)}</h3>
              <span class="badge">${pos.totalVotes} total votes cast</span>
            </div>
            ${candidates.length ? candidates.map((cand, idx) => {
              const isWinner = pos.winnerIds && pos.winnerIds.includes(cand.id);
              return `
                <div class="candidate-result-row">
                  <div class="result-info">
                    <span class="result-name">
                      ${idx === 0 && isWinner ? '👑' : '•'} ${escapeHtml(cand.name)}
                      ${isWinner ? '<span class="badge badge-winner">Leading / Winner</span>' : ''}
                    </span>
                    <span class="result-votes"><strong>${cand.votes}</strong> votes (${cand.percentage}%)</span>
                  </div>
                  <div class="progress-bar-bg">
                    <div class="progress-bar-fill ${isWinner ? 'leader' : ''}" style="width:${Math.max(cand.percentage, 1)}%"></div>
                  </div>
                </div>
              `;
            }).join('') : '<div class="empty-msg">No candidates for this position.</div>'}
          </div>
        `;
      }).join('');
    }

    refreshResultsBtn.addEventListener('click', loadResults);
    loadResults();
    // Auto-refresh every 30 seconds
    setInterval(loadResults, 30000);
  </script>
</body>

</html>
