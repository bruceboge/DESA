<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DESA Decides 2026 - Voter Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app-container">
    <div class="header">
      <div class="header-brand">
        <img class="brand-logo" src="logo.jpg" alt="DESA logo" onerror="this.style.display='none';" />
        <h1><a href="index.html">🗳️ DESA Decides 2026</a> <span>Official</span></h1>
      </div>
      <div class="nav-tabs">
        <a href="index.html" class="active">🔐 Login</a>
        <a href="ballot.html">📋 Ballot</a>
        <a href="results.html">📊 Results</a>
        <a href="admin.html">⚙️ Admin</a>
      </div>
    </div>

    <div class="content" style="display:flex;align-items:center;justify-content:center;">
      <div class="card login-box" style="width:100%;max-width:440px;">
        <h2>🔑 Voter Login</h2>
        <p style="color:#4b6a89;margin-bottom:18px">Enter your assigned Voter ID to access your official ballot.</p>
        <div id="loginMessage" class="status-bar" style="display:none;width:100%;text-align:center"></div>
        <form id="voterLoginForm">
          <input type="text" id="loginVoterId" placeholder="Voter ID (e.g. voter1)" autocomplete="off" required>
          <button class="primary" id="loginBtn" type="submit" style="width:100%;justify-content:center;margin-top:8px">
            Access Official Ballot →
          </button>
        </form>
        <div style="margin-top:24px;padding-top:16px;border-top:1px solid #eef2f7;font-size:.88rem;color:#728ea9">
          Public observer? <a href="results.html" style="color:#0b2b4f;font-weight:600">View Public Results</a>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { api, setVoterSession, getVoterSession } from './common.js';

    // If already logged in, offer quick jump or auto-redirect
    const existing = getVoterSession();
    if (existing?.voterId) {
      document.getElementById('loginVoterId').value = existing.voterId;
    }

    const form = document.getElementById('voterLoginForm');
    const input = document.getElementById('loginVoterId');
    const msg = document.getElementById('loginMessage');
    const btn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const voterId = input.value.trim();
      if (!voterId) return;

      btn.disabled = true;
      btn.textContent = 'Verifying Voter ID...';
      msg.style.display = 'none';

      try {
        const voter = await api(`/voters/${encodeURIComponent(voterId)}`);
        setVoterSession({ voterId, name: voter.name });
        window.location.href = 'ballot.html';
      } catch (err) {
        msg.textContent = err.message;
        msg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Access Official Ballot →';
      }
    });
  </script>
</body>

</html>
